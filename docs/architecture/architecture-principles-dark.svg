<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 -14 1158 598" width="1158" height="598" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12"><defs><filter id="msh" x="-10%" y="-10%" width="125%" height="135%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/></filter></defs><rect x="16" y="-14" width="1158" height="598" fill="#0f1522"/><rect x="20" y="-10" width="1150" height="590" fill="none" stroke="#8a93a3"/><path d="M20,-10 H366 V2 L356,12 H20 Z" fill="#182133" stroke="#3c4b67"/><text x="26" y="5" fill="#e8edf7">req [Package] Principles [Architecture principles]</text><g data-node="_c95d46896be9436cabed7dcb9ab6e174"><rect x="40" y="40" width="240" height="220" rx="4" fill="#182133" stroke="#3c4b67" filter="url(#msh)"/><path d="M40.5,84 V44 Q40.5,40.5 44,40.5 H276 Q279.5,40.5 279.5,44 V84 Z" fill="#1c335f"/><rect x="40" y="40" width="240" height="220" rx="4" fill="none" stroke="#3c4b67"/><rect x="41" y="41" width="238" height="3" rx="1.5" fill="#5b8cff"/><text x="160" y="58" text-anchor="middle" font-size="11" fill="#93a0b8">&#171;requirement&#187;</text><text x="160" y="74" text-anchor="middle" font-size="13.5" fill="#e8edf7" font-weight="600">Independent core</text><line x1="40" y1="84" x2="280" y2="84" stroke="#2c3850"/><text x="47" y="98" text-anchor="start" font-size="11.5" fill="#e8edf7">Id = &quot;ARCH-001&quot;</text><text x="47" y="114" text-anchor="start" font-size="11.5" fill="#e8edf7">Text = &quot;Meridian.Core shall not</text><text x="47" y="130" text-anchor="start" font-size="11.5" fill="#e8edf7">depend on any other Meridian</text><text x="47" y="146" text-anchor="start" font-size="11.5" fill="#e8edf7">assembly, storage engine or UI</text><text x="47" y="162" text-anchor="start" font-size="11.5" fill="#e8edf7">framework.&quot;</text><line x1="40" y1="172" x2="280" y2="172" stroke="#2c3850"/><text x="160" y="186" text-anchor="middle" font-size="10.5" fill="#6ea8ff" font-style="italic">satisfiedBy</text><text x="47" y="202" text-anchor="start" font-size="11.5" fill="#b9d2ff">Meridian.Core</text><line x1="40" y1="212" x2="280" y2="212" stroke="#2c3850"/><text x="160" y="226" text-anchor="middle" font-size="10.5" fill="#6ea8ff" font-style="italic">verifiedBy</text><text x="47" y="242" text-anchor="start" font-size="11.5" fill="#b9d2ff">&#171;testCase&#187; Self-architecture check</text></g><g data-node="_f401b2aa261d4dee89638c58c9b6c5fe"><rect x="310" y="40" width="240" height="220" rx="4" fill="#182133" stroke="#3c4b67" filter="url(#msh)"/><path d="M310.5,84 V44 Q310.5,40.5 314,40.5 H546 Q549.5,40.5 549.5,44 V84 Z" fill="#1c335f"/><rect x="310" y="40" width="240" height="220" rx="4" fill="none" stroke="#3c4b67"/><rect x="311" y="41" width="238" height="3" rx="1.5" fill="#5b8cff"/><text x="430" y="58" text-anchor="middle" font-size="11" fill="#93a0b8">&#171;requirement&#187;</text><text x="430" y="74" text-anchor="middle" font-size="13.5" fill="#e8edf7" font-weight="600">Acyclic assemblies</text><line x1="310" y1="84" x2="550" y2="84" stroke="#2c3850"/><text x="317" y="98" text-anchor="start" font-size="11.5" fill="#e8edf7">Id = &quot;ARCH-002&quot;</text><text x="317" y="114" text-anchor="start" font-size="11.5" fill="#e8edf7">Text = &quot;Each assembly shall use</text><text x="317" y="130" text-anchor="start" font-size="11.5" fill="#e8edf7">only the assemblies its &#171;allowed&#187;</text><text x="317" y="146" text-anchor="start" font-size="11.5" fill="#e8edf7">dependencies name; the assembly</text><text x="317" y="162" text-anchor="start" font-size="11.5" fill="#e8edf7">graph shall stay acyclic.&quot;</text><line x1="310" y1="172" x2="550" y2="172" stroke="#2c3850"/><text x="430" y="186" text-anchor="middle" font-size="10.5" fill="#6ea8ff" font-style="italic">satisfiedBy</text><text x="317" y="202" text-anchor="start" font-size="11.5" fill="#b9d2ff">Assemblies</text><line x1="310" y1="212" x2="550" y2="212" stroke="#2c3850"/><text x="430" y="226" text-anchor="middle" font-size="10.5" fill="#6ea8ff" font-style="italic">verifiedBy</text><text x="317" y="242" text-anchor="start" font-size="11.5" fill="#b9d2ff">&#171;testCase&#187; Self-architecture check</text></g><g data-node="_602d7f43cfc54f1ab30a7d1736ddab44"><rect x="580" y="40" width="240" height="230" rx="4" fill="#182133" stroke="#3c4b67" filter="url(#msh)"/><path d="M580.5,84 V44 Q580.5,40.5 584,40.5 H816 Q819.5,40.5 819.5,44 V84 Z" fill="#1c335f"/><rect x="580" y="40" width="240" height="230" rx="4" fill="none" stroke="#3c4b67"/><rect x="581" y="41" width="238" height="3" rx="1.5" fill="#5b8cff"/><text x="700" y="58" text-anchor="middle" font-size="11" fill="#93a0b8">&#171;requirement&#187;</text><text x="700" y="74" text-anchor="middle" font-size="13.5" fill="#e8edf7" font-weight="600">One application, two hosts</text><line x1="580" y1="84" x2="820" y2="84" stroke="#2c3850"/><text x="587" y="98" text-anchor="start" font-size="11.5" fill="#e8edf7">Id = &quot;ARCH-003&quot;</text><text x="587" y="114" text-anchor="start" font-size="11.5" fill="#e8edf7">Text = &quot;The team server and the</text><text x="587" y="130" text-anchor="start" font-size="11.5" fill="#e8edf7">desktop app shall run the same</text><text x="587" y="146" text-anchor="start" font-size="11.5" fill="#e8edf7">Meridian.Web application; the</text><text x="587" y="162" text-anchor="start" font-size="11.5" fill="#e8edf7">desktop app shall host it</text><text x="587" y="178" text-anchor="start" font-size="11.5" fill="#e8edf7">in-process.&quot;</text><line x1="580" y1="188" x2="820" y2="188" stroke="#2c3850"/><text x="700" y="202" text-anchor="middle" font-size="10.5" fill="#6ea8ff" font-style="italic">satisfiedBy</text><text x="587" y="218" text-anchor="start" font-size="11.5" fill="#b9d2ff">&#171;block&#187; Desktop shell</text><line x1="580" y1="228" x2="820" y2="228" stroke="#2c3850"/><text x="700" y="242" text-anchor="middle" font-size="10.5" fill="#6ea8ff" font-style="italic">verifiedBy</text><text x="587" y="258" text-anchor="start" font-size="11.5" fill="#b9d2ff">&#171;testCase&#187; Local mode end-to-end</text></g><g data-node="_c997177e0a574118b671700390d052fe"><rect x="850" y="40" width="240" height="220" rx="4" fill="#182133" stroke="#3c4b67" filter="url(#msh)"/><path d="M850.5,84 V44 Q850.5,40.5 854,40.5 H1086 Q1089.5,40.5 1089.5,44 V84 Z" fill="#1c335f"/><rect x="850" y="40" width="240" height="220" rx="4" fill="none" stroke="#3c4b67"/><rect x="851" y="41" width="238" height="3" rx="1.5" fill="#5b8cff"/><text x="970" y="58" text-anchor="middle" font-size="11" fill="#93a0b8">&#171;requirement&#187;</text><text x="970" y="74" text-anchor="middle" font-size="13.5" fill="#e8edf7" font-weight="600">Storage behind one contract</text><line x1="850" y1="84" x2="1090" y2="84" stroke="#2c3850"/><text x="857" y="98" text-anchor="start" font-size="11.5" fill="#e8edf7">Id = &quot;ARCH-004&quot;</text><text x="857" y="114" text-anchor="start" font-size="11.5" fill="#e8edf7">Text = &quot;All persistence shall go</text><text x="857" y="130" text-anchor="start" font-size="11.5" fill="#e8edf7">through IMeridianStore, with</text><text x="857" y="146" text-anchor="start" font-size="11.5" fill="#e8edf7">PostgreSQL for team servers and</text><text x="857" y="162" text-anchor="start" font-size="11.5" fill="#e8edf7">SQLite for local mode.&quot;</text><line x1="850" y1="172" x2="1090" y2="172" stroke="#2c3850"/><text x="970" y="186" text-anchor="middle" font-size="10.5" fill="#6ea8ff" font-style="italic">satisfiedBy</text><text x="857" y="202" text-anchor="start" font-size="11.5" fill="#b9d2ff">&#171;interfaceBlock&#187; IMeridianStore</text><line x1="850" y1="212" x2="1090" y2="212" stroke="#2c3850"/><text x="970" y="226" text-anchor="middle" font-size="10.5" fill="#6ea8ff" font-style="italic">verifiedBy</text><text x="857" y="242" text-anchor="start" font-size="11.5" fill="#b9d2ff">&#171;testCase&#187; Self-architecture check</text></g><g data-node="_1783bdf486364c30a7f4ef936a2df97a"><rect x="40" y="310" width="240" height="230" rx="4" fill="#182133" stroke="#3c4b67" filter="url(#msh)"/><path d="M40.5,354 V314 Q40.5,310.5 44,310.5 H276 Q279.5,310.5 279.5,314 V354 Z" fill="#1c335f"/><rect x="40" y="310" width="240" height="230" rx="4" fill="none" stroke="#3c4b67"/><rect x="41" y="311" width="238" height="3" rx="1.5" fill="#5b8cff"/><text x="160" y="328" text-anchor="middle" font-size="11" fill="#93a0b8">&#171;requirement&#187;</text><text x="160" y="344" text-anchor="middle" font-size="13.5" fill="#e8edf7" font-weight="600">Undoable, replicable edits</text><line x1="40" y1="354" x2="280" y2="354" stroke="#2c3850"/><text x="47" y="368" text-anchor="start" font-size="11.5" fill="#e8edf7">Id = &quot;ARCH-005&quot;</text><text x="47" y="384" text-anchor="start" font-size="11.5" fill="#e8edf7">Text = &quot;Every model change shall go</text><text x="47" y="400" text-anchor="start" font-size="11.5" fill="#e8edf7">through ModelRepository as an</text><text x="47" y="416" text-anchor="start" font-size="11.5" fill="#e8edf7">undoable operation that can be</text><text x="47" y="432" text-anchor="start" font-size="11.5" fill="#e8edf7">replicated to other sessions.&quot;</text><line x1="40" y1="442" x2="280" y2="442" stroke="#2c3850"/><text x="160" y="456" text-anchor="middle" font-size="10.5" fill="#6ea8ff" font-style="italic">satisfiedBy</text><text x="47" y="472" text-anchor="start" font-size="11.5" fill="#b9d2ff">&#171;block&#187; Model kernel</text><line x1="40" y1="482" x2="280" y2="482" stroke="#2c3850"/><text x="160" y="496" text-anchor="middle" font-size="10.5" fill="#6ea8ff" font-style="italic">verifiedBy</text><text x="47" y="512" text-anchor="start" font-size="11.5" fill="#b9d2ff">&#171;testCase&#187; Undo and replication</text><text x="47" y="528" text-anchor="start" font-size="11.5" fill="#b9d2ff">&#171;testCase&#187; Assistant change sets</text></g><g data-node="_ea980901a0ba403a826e30ef9c755fd8"><rect x="310" y="310" width="240" height="220" rx="4" fill="#182133" stroke="#3c4b67" filter="url(#msh)"/><path d="M310.5,354 V314 Q310.5,310.5 314,310.5 H546 Q549.5,310.5 549.5,314 V354 Z" fill="#1c335f"/><rect x="310" y="310" width="240" height="220" rx="4" fill="none" stroke="#3c4b67"/><rect x="311" y="311" width="238" height="3" rx="1.5" fill="#5b8cff"/><text x="430" y="328" text-anchor="middle" font-size="11" fill="#93a0b8">&#171;requirement&#187;</text><text x="430" y="344" text-anchor="middle" font-size="13.5" fill="#e8edf7" font-weight="600">Native code out of process</text><line x1="310" y1="354" x2="550" y2="354" stroke="#2c3850"/><text x="317" y="368" text-anchor="start" font-size="11.5" fill="#e8edf7">Id = &quot;ARCH-006&quot;</text><text x="317" y="384" text-anchor="start" font-size="11.5" fill="#e8edf7">Text = &quot;FMU native code shall run</text><text x="317" y="400" text-anchor="start" font-size="11.5" fill="#e8edf7">in a separate Meridian.FmuHost</text><text x="317" y="416" text-anchor="start" font-size="11.5" fill="#e8edf7">process so a crash cannot take down</text><text x="317" y="432" text-anchor="start" font-size="11.5" fill="#e8edf7">the server.&quot;</text><line x1="310" y1="442" x2="550" y2="442" stroke="#2c3850"/><text x="430" y="456" text-anchor="middle" font-size="10.5" fill="#6ea8ff" font-style="italic">satisfiedBy</text><text x="317" y="472" text-anchor="start" font-size="11.5" fill="#b9d2ff">&#171;block&#187; FMU process</text><line x1="310" y1="482" x2="550" y2="482" stroke="#2c3850"/><text x="430" y="496" text-anchor="middle" font-size="10.5" fill="#6ea8ff" font-style="italic">verifiedBy</text><text x="317" y="512" text-anchor="start" font-size="11.5" fill="#b9d2ff">&#171;testCase&#187; FMU crash isolation</text></g><g data-node="_2df40c1eed0b482dadcae7edacd80252"><rect x="580" y="310" width="240" height="250" rx="4" fill="#182133" stroke="#3c4b67" filter="url(#msh)"/><path d="M580.5,354 V314 Q580.5,310.5 584,310.5 H816 Q819.5,310.5 819.5,314 V354 Z" fill="#1c335f"/>