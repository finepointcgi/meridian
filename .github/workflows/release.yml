name: Release
# Push a tag like v0.2.0 to build the Windows, macOS and Linux desktop apps and the server, and attach them to a GitHub release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Meridian.slnx -c Release
      - run: build/package.sh "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
