name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Meridian.slnx -c Release
      # Browser tests run in the e2e job below (they skip themselves when Playwright's Chromium is missing anyway).
      - run: dotnet test Meridian.slnx -c Release --no-build --filter "FullyQualifiedName!~Meridian.E2E"

  # End-to-end browser tests: the real app in-process (SQLite) driven by Playwright's headless Chromium.
  e2e:
    runs-on: ubuntu-latest
    env:
      MERIDIAN_E2E: require   # a missing browser fails this job instead of skipping
      CONFIGURATION: Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Playwright Chromium (and its system libraries)
        run: tests/Meridian.E2E/install-browsers.sh --with-deps
      - name: Browser tests
        run: dotnet test tests/Meridian.E2E -c Release --no-build --logger "console;verbosity=normal"
        env:
          MERIDIAN_E2E_SCREENSHOTS: ${{ github.workspace }}/e2e-screenshots
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore

  # Catches packaging regressions early: the Linux tar.gz and .deb (no signing, no AppImage tool needed).
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check scripts
        run: |
          bash -n build/package.sh build/macos/import-cert.sh
          sh -n build/linux/install.sh build/linux/AppRun
      - name: Package linux-x64
        run: SKIP_SERVER=1 build/package.sh 0.0.0-ci linux-x64
      - name: Inspect the .deb
        run: |
          dpkg-deb --info artifacts/Meridian-0.0.0-ci-linux-x64.deb
          dpkg-deb --contents artifacts/Meridian-0.0.0-ci-linux-x64.deb | grep -E 'usr/share/mime/packages/meridian.xml|opt/meridian/Meridian$'
          grep -q 'Meridian-0.0.0-ci-linux-x64.tar.gz' artifacts/SHA256SUMS.txt
