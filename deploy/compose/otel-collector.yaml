# OpenTelemetry Collector for the "otel" profile of docker-compose.prod.yml.
# Meridian sends traces and metrics here when MERIDIAN_OTLP_ENDPOINT=http://otel-collector:4317.
# Replace the "debug" exporter with your backend (Grafana Tempo/Mimir, Honeycomb, Datadog, Elastic, ...).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}
  # Defence in depth: drop attributes that could carry credentials if an instrumentation ever records them.
  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: url.query
        action: delete

exporters:
  debug:
    verbosity: basic
  # otlphttp:
  #   endpoint: https://otlp.example.com
  #   headers:
  #     authorization: "Bearer ${env:OTLP_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
