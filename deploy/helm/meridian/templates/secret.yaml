{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meridian.secretName" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.postgresql.enabled }}
  MERIDIAN_DB_PASSWORD: {{ required "externalDatabase.password is required (or use secrets.existingSecret)" .Values.externalDatabase.password | quote }}
  {{- end }}
  {{- range $i, $s := .Values.secrets.ssoClientSecrets }}
  Meridian__Sso__Providers__{{ $i }}__ClientSecret: {{ $s | quote }}
  {{- end }}
{{- end }}
